services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: schemasprint_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schemasprint_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../../db/tests/auth-shim.sql:/docker-entrypoint-initdb.d/00-auth.sql:ro
