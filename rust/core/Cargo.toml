[package]
name = "schemasprint-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "schemasprint_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
abi3-py312 = ["pyo3/abi3-py312"]

[dependencies]
pyo3 = "0.24.2"
pythonize = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
