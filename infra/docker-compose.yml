services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy infra/local/.env.example to infra/local/.env}
      POSTGRES_USER: ${POSTGRES_USER:?copy infra/local/.env.example to infra/local/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy infra/local/.env.example to infra/local/.env}
    volumes:
      - schemasprint_pgdata:/var/lib/postgresql/data
      - ./local/postgres-init/0000_auth.sql:/docker-entrypoint-initdb.d/0000_auth.sql:ro
      - ../db/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: infra/cloudflare/gateway/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_PEPPER: ${SESSION_PEPPER:?copy infra/local/.env.example to infra/local/.env}
      CSRF_KEY: ${CSRF_KEY:?copy infra/local/.env.example to infra/local/.env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?copy infra/local/.env.example to infra/local/.env}
      JEV_MODE: ${JEV_MODE:-stub}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-10}
      JEV_MAX_RETRIES: ${JEV_MAX_RETRIES:-2}
      LLM_MODE: ${LLM_MODE:-unavailable}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-20}
      BILLING_ENABLED: "false"
      REWARDED_ADS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ..
      dockerfile: infra/local/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  schemasprint_pgdata:
