name: Database quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.26
      - run: uv sync --locked --group local-postgres
      - run: uv run ruff check tests
      - run: uv run ruff format --check tests
      - run: uv run mypy tests
      - run: uv run sqlfluff lint db
      - run: uv run pytest tests/db -q
