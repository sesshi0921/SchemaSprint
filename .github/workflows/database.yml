name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.26
      - run: uv sync --locked --group local-postgres
      - run: uv run maturin build --manifest-path rust/core/Cargo.toml --release --out /tmp/schemasprint-core-wheels
      - run: uv venv /tmp/schemasprint-core-wheel-venv --python 3.12
      - run: uv pip install --python /tmp/schemasprint-core-wheel-venv/bin/python /tmp/schemasprint-core-wheels/*.whl
      - run: /tmp/schemasprint-core-wheel-venv/bin/python -c "import schemasprint_core; assert callable(schemasprint_core.compute_assessment); assert callable(schemasprint_core.validate_canonical_schema)"
      - run: uv run ruff check backend tests
      - run: uv run ruff format --check backend tests
      - run: uv run mypy backend tests
      - run: uv run sqlfluff lint db
      - run: uv run python -m openapi_spec_validator openapi.yaml
      - run: uv run pytest tests -q
      - run: cargo fmt --manifest-path rust/core/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/core/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/core/Cargo.toml
      - run: cargo build --manifest-path rust/core/Cargo.toml --release
