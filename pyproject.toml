[project]
name = "schemasprint"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=44,<47",
    "structlog>=25,<26",
    "ulid-py>=1.1,<2",
    "uvicorn[standard]>=0.35,<1",
    "schemasprint-core==0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "maturin>=1.7,<2",
  "sqlfluff>=3.4,<4",
  "openapi-spec-validator>=0.7,<1",
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
  "pytest-asyncio>=1,<2",
  "respx>=0.22,<1",
]
local-postgres = ["pgserver==0.1.4; python_version < '3.13'"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/schemasprint_api"]

[tool.uv.sources]
schemasprint-core = { path = "rust/core" }
